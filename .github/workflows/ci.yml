# CI for PQ-Chat (CLAUDE.md §8). The build fails on:
#   * any failing test,
#   * a Bandit high-severity finding,
#   * a Semgrep error,
#   * a pip-audit vulnerability,
#   * a ProVerif result that differs from the expected one (formal/run.sh).
#
# Third-party actions are pinned to full commit SHAs (SR-32): a moved tag cannot change what runs.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  LIBOQS_PREFIX: ${{ github.workspace }}/.liboqs

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-24.04
    env:
      # Point liboqs-python at our pinned build so it never auto-downloads another one.
      OQS_INSTALL_PATH: ${{ github.workspace }}/.liboqs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools for liboqs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build libssl-dev

      - name: Cache liboqs build
        id: liboqs-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LIBOQS_PREFIX }}
          key: liboqs-${{ runner.os }}-${{ hashFiles('scripts/install_liboqs.sh') }}

      - name: Build liboqs from source
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        run: scripts/install_liboqs.sh "$LIBOQS_PREFIX"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints.txt -e '.[dev]'

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest with coverage
        run: pytest --cov=pqchat --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints.txt bandit pip-audit
          python -m venv /tmp/semgrep && /tmp/semgrep/bin/pip install semgrep==1.183.0

      - name: Bandit (fail on high severity)
        run: bandit -c pyproject.toml -r src --severity-level high

      - name: Semgrep rule self-test
        run: /tmp/semgrep/bin/semgrep --test --metrics=off --config .semgrep/pqchat-rules.yml .semgrep/pqchat-rules.py

      - name: Semgrep (project rules + public rulesets)
        run: >
          /tmp/semgrep/bin/semgrep scan --error --metrics=off
          --config .semgrep/pqchat-rules.yml
          --config p/python
          --config p/security-audit
          src tests

      - name: pip-audit (all pinned dependencies)
        run: pip-audit --strict -r requirements/constraints.txt

  docker:
    name: Docker build + compose smoke test
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build images (runs the ML-KEM self-test during build)
        run: docker compose build

      - name: Start relay (TLS 1.3) and two clients
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' pqchat-relay-1 || true)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy

      - name: Smoke checks
        run: |
          docker compose exec -T relay python -m pqchat.server.healthcheck   # verifies TLS + certificate
          docker compose exec -T alice python -m pqchat.selftest
          for port in 8701 8702; do
            for i in $(seq 1 30); do curl -fsS -o /dev/null "http://127.0.0.1:$port/" && break; sleep 1; done
            curl -fsS -o /dev/null "http://127.0.0.1:$port/"
            # DNS-rebinding defence: a foreign Host header must be refused (421)
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' "http://127.0.0.1:$port/")" = 421
          done

      - name: Tear down
        if: always()
        run: docker compose down -v

  formal:
    name: ProVerif (formal/run.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: System packages for ProVerif (its optional GUI needs GTK2 headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk2.0-dev bc

      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "4.14"

      - name: Install ProVerif 2.05
        run: opam install -y proverif.2.05

      - name: Run all scenarios and compare with expected results
        run: opam exec -- formal/run.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proverif-logs
          path: formal/out/*.log
